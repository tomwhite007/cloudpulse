name: CloudPulse Terraform Apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: 'true'
  TF_CLI_ARGS: '-no-color'
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}

jobs:
  detect-affected:
    name: Detect Affected Infra
    runs-on: ubuntu-latest
    outputs:
      is_infra_affected: ${{ steps.affected.outputs.is_infra_affected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Identify if Infra is Affected
        id: affected
        run: |
          set -e
          pnpm install --frozen-lockfile
          AFFECTED=$(pnpm nx show projects --affected || true)
          IS_AFFECTED="false"
          if echo "$AFFECTED" | grep -q "^infra$"; then
            IS_AFFECTED="true"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_AFFECTED="true"
          fi
          echo "is_infra_affected=$IS_AFFECTED" >> "$GITHUB_OUTPUT"
          echo "Infra affected: $IS_AFFECTED"

  lint-and-validate:
    name: Lint & Validate Terraform
    needs: detect-affected
    if: needs.detect-affected.outputs.is_infra_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: Validate HCL Syntax
        working-directory: apps/infra/environments/sandbox
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate

  terraform-apply:
    name: Apply Sandbox Terraform
    needs: [detect-affected, lint-and-validate]
    if: needs.detect-affected.outputs.is_infra_affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        working-directory: apps/infra/environments/sandbox
        run: terraform init -no-color

      - name: Apply Terraform Changes
        working-directory: apps/infra/environments/sandbox
        run: terraform apply -auto-approve -no-color
