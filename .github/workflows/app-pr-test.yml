name: CloudPulse Application PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}

jobs:
  detect-affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affected.outputs.affected_apps }}
      has_apps: ${{ steps.affected.outputs.has_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Identify Affected Applications
        id: affected
        run: |
          set -e
          pnpm install --frozen-lockfile
          AFFECTED=$(pnpm nx show projects --affected --type=app | grep -E '^(web-portal|auditor-api)$' || true)
          JSON_ARRAY=$(echo "$AFFECTED" | jq -R . | jq -s -c .)
          HAS_APPS="false"
          if [ "$JSON_ARRAY" != "[]" ]; then
            HAS_APPS="true"
          fi
          echo "affected_apps=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo "has_apps=$HAS_APPS" >> "$GITHUB_OUTPUT"

  lint-and-test:
    name: Run Unit Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive SHAs for Nx
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gate (Lint & Unit Tests)
        run: pnpm nx affected -t lint test --exclude=infra

  docker-build-check:
    name: Verify Docker Build (${{ matrix.app }})
    needs: [detect-affected, lint-and-test]
    if: needs.detect-affected.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-affected.outputs.affected_apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set App Variables
        id: vars
        run: |
          if [ "${{ matrix.app }}" = "web-portal" ]; then
            echo "dockerfile=apps/web-portal/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.app }}" = "auditor-api" ]; then
            echo "dockerfile=apps/auditor-api/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (ARM64 Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-run Docker ARM64 Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.vars.outputs.dockerfile }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha
