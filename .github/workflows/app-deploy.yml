name: CloudPulse Application Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-west-1' }}
  CLUSTER_NAME: cloudpulse-sandbox-cluster

jobs:
  detect-affected:
    name: Detect Affected Projects
    runs-on: ubuntu-latest
    outputs:
      affected_apps: ${{ steps.affected.outputs.affected_apps }}
      has_apps: ${{ steps.affected.outputs.has_apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive SHAs for Nx Affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Identify Affected Applications
        id: affected
        run: |
          set -e
          pnpm install --frozen-lockfile
          AFFECTED=$(pnpm nx show projects --affected --type=app | grep -E '^(web-portal|auditor-api)$' || true)
          
          # Handle workflow_dispatch fallback to all apps
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$AFFECTED" ]; then
            AFFECTED="web-portal
          auditor-api"
          fi

          # Format as JSON array for matrix execution
          JSON_ARRAY=$(echo "$AFFECTED" | jq -R . | jq -s -c .)
          HAS_APPS="false"
          if [ "$JSON_ARRAY" != "[]" ]; then
            HAS_APPS="true"
          fi

          echo "affected_apps=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          echo "has_apps=$HAS_APPS" >> "$GITHUB_OUTPUT"
          echo "Affected apps detected: $JSON_ARRAY"

  lint-and-test:
    name: Lint & Test Quality Gate
    needs: detect-affected
    if: needs.detect-affected.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Derive SHAs for Nx
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: 'main'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gate (Lint & Unit Tests)
        run: pnpm nx affected -t lint test

  deploy-apps:
    name: Build & Deploy (${{ matrix.app }})
    needs: [detect-affected, lint-and-test]
    if: needs.detect-affected.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-affected.outputs.affected_apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set App Variables
        id: vars
        run: |
          if [ "${{ matrix.app }}" = "web-portal" ]; then
            echo "dockerfile=apps/web-portal/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "ecr_repo=cloudpulse-web" >> "$GITHUB_OUTPUT"
            echo "ecs_service=cloudpulse-web" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.app }}" = "auditor-api" ]; then
            echo "dockerfile=apps/auditor-api/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "ecr_repo=cloudpulse-auditor-api" >> "$GITHUB_OUTPUT"
            echo "ecs_service=cloudpulse-auditor-api" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown app: ${{ matrix.app }}"
            exit 1
          fi

      - name: Set up QEMU (ARM64 Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.vars.outputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.vars.outputs.ecr_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.CLUSTER_NAME }}" \
            --service "${{ steps.vars.outputs.ecs_service }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" >/dev/null
          echo "✅ Triggered ECS rolling update for ${{ steps.vars.outputs.ecs_service }}"
